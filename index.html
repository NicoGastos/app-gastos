<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nuestros Gastos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 15px;
    }

    .estado {
      text-align: center;
      font-size: 13px;
      margin-bottom: 15px;
      color: #666;
    }

    .saldo {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .saldo h2 {
      margin: 5px;
      font-size: 32px;
    }

    .formulario {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input,
    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .lista {
      margin-top: 20px;
    }

    .gasto {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .datos-gasto {
      flex: 1;
    }

    .descripcion {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .detalle {
      color: #555;
      font-size: 14px;
    }

    .fecha {
      color: #888;
      font-size: 12px;
      margin-top: 5px;
    }

    .eliminar {
      font-size: 23px;
      cursor: pointer;
      padding: 10px;
      margin-left: 10px;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>💰 Nuestros Gastos</h1>

  <div class="subtitulo">
    Nico & Cyn
  </div>

  <div class="estado" id="estado">
    Conectando...
  </div>

  <div class="saldo">
    <div>Total gastado</div>
    <h2 id="total">$0</h2>
  </div>

  <div class="formulario">

    <input
      type="text"
      id="descripcion"
      placeholder="¿En qué gastamos?"
    >

    <input
      type="number"
      id="monto"
      placeholder="Monto"
      min="0"
      step="0.01"
    >

    <select id="categoria">

      <option value="Otros">Otros</option>
      <option value="Comida">Comida</option>
      <option value="Transporte">Transporte</option>
      <option value="Impuestos">Impuestos</option>

      <option value="Tarjetas Ciudad">Tarjetas Ciudad</option>
      <option value="Tarjetas Nacion">Tarjetas Nacion</option>
      <option value="Tarjetas BBVA">Tarjetas BBVA</option>

      <option value="Colegio Juli">Colegio Juli</option>
      <option value="Colegio Agus">Colegio Agus</option>
      <option value="Colegio Tomi">Colegio Tomi</option>

      <option value="Terapia Maga">Maga</option>
      <option value="Terapia Ale">Ale</option>

      <option value="Supermercado">Supermercado</option>

      <option value="Cochera Auto">Cochera Auto</option>
      <option value="Cochera Moto">Cochera Moto</option>

      <option value="Seguro Auto">Seguro Auto</option>
      <option value="Seguro Moto">Seguro Moto</option>

      <option value="Expensas">Expensas</option>

      <option value="Luz">Luz</option>
      <option value="Gas">Gas</option>
      <option value="ABL">ABL</option>
      <option value="AYSA">AYSA</option>
      <option value="CABLE">CABLE</option>
      <option value="Celular">Celular</option>

      <option value="Viaje de Egresado">
        Viaje Egresados Juli
      </option>

      <option value="Gira Deportiva">
        Gira Deportiva Juli
      </option>

    </select>

    <select id="persona">
      <option value="Nico">Nico</option>
      <option value="Cyn">Cyn</option>
    </select>

    <button
      id="botonAgregar"
      type="button"
      onclick="agregarGasto()"
    >
      Agregar gasto
    </button>

  </div>

  <div class="lista" id="lista"></div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


  import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


  /*
  ======================================
  CONFIGURACIÓN FIREBASE
  ======================================
  */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCLKkcyErLlAWXx7pIPyvj8ihqwedljXi98",

    authDomain:
      "app-gastos-aa092.firebaseapp.com",

    projectId:
      "app-gastos-aa092",

    storageBucket:
      "app-gastos-aa092.firebasestorage.app",

    messagingSenderId:
      "619381910434",

    appId:
      "1:619381910434:web:bb1dc0a9a4336b979de0fb"

  };


  /*
  ======================================
  INICIAR FIREBASE
  ======================================
  */

  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);

  const gastosRef =
    collection(db, "gastos");


  let gastos = [];

  const estado =
    document.getElementById("estado");


  /*
  ======================================
  FORMATO DE DINERO
  ======================================
  */

  function formatoDinero(numero) {

    return Number(numero).toLocaleString(
      "es-AR",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    );

  }


  /*
  ======================================
  MOSTRAR GASTOS
  ======================================
  */

  function mostrarGastos() {

    const lista =
      document.getElementById("lista");

    const totalElemento =
      document.getElementById("total");

    lista.innerHTML = "";

    let total = 0;


    gastos.forEach((gasto) => {

      const monto =
        Number(gasto.monto) || 0;

      total += monto;


      const item =
        document.createElement("div");

      item.className = "gasto";


      let fechaTexto = "";

      if (gasto.fecha) {

        try {

          if (
            typeof gasto.fecha.toDate === "function"
          ) {

            fechaTexto =
              gasto.fecha
                .toDate()
                .toLocaleString("es-AR");

          } else {

            fechaTexto =
              new Date(gasto.fecha)
                .toLocaleString("es-AR");

          }

        } catch (error) {

          fechaTexto = "";

        }

      }


      item.innerHTML = `

        <div class="datos-gasto">

          <div class="descripcion">
            ${gasto.descripcion}
          </div>

          <div class="detalle">

            $${formatoDinero(monto)}

            ·

            ${gasto.categoria}

            ·

            ${gasto.persona}

          </div>

          ${
            fechaTexto
              ? `<div class="fecha">${fechaTexto}</div>`
              : ""
          }

        </div>

        <span
          class="eliminar"
          data-id="${gasto.id}"
          title="Eliminar gasto"
        >
          🗑️
        </span>

      `;


      const botonEliminar =
        item.querySelector(".eliminar");


      botonEliminar.addEventListener(
        "click",
        () => eliminarGasto(gasto.id)
      );


      lista.appendChild(item);

    });


    totalElemento.textContent =
      "$" + formatoDinero(total);

  }


  /*
  ======================================
  ESCUCHAR FIRESTORE EN TIEMPO REAL
  ======================================
  */

  const consulta =
    query(
      gastosRef,
      orderBy("fecha", "desc")
    );


  onSnapshot(

    consulta,

    (snapshot) => {

      gastos = [];

      snapshot.forEach((documento) => {

        gastos.push({

          id: documento.id,

          ...documento.data()

        });

      });


      mostrarGastos();

      estado.textContent =
        "☁️ Sincronizado";

    },

    (error) => {

      console.error(
        "Error al leer Firestore:",
        error
      );

      estado.textContent =
        "⚠️ Error de conexión";

    }

  );


  /*
  ======================================
  AGREGAR GASTO
  ======================================
  */

  async function agregarGasto() {

    const descripcion =
      document
        .getElementById("descripcion")
        .value
        .trim();


    const montoTexto =
      document
        .getElementById("monto")
        .value;


    const categoria =
      document
        .getElementById("categoria")
        .value;


    const persona =
      document
        .getElementById("persona")
        .value;


    const monto =
      Number(montoTexto);


    if (descripcion === "") {

      alert(
        "Ingresá una descripción."
      );

      return;

    }


    if (
      montoTexto === "" ||
      isNaN(monto) ||
      monto <= 0
    ) {

      alert(
        "Ingresá un monto válido."
      );

      return;

    }


    const boton =
      document.getElementById(
        "botonAgregar"
      );


    try {

      boton.disabled = true;

      boton.textContent =
        "Guardando...";


      await addDoc(
        gastosRef,
        {

          descripcion: descripcion,

          monto: monto,

          categoria: categoria,

          persona: persona,

          fecha: serverTimestamp()

        }
      );


      document
        .getElementById("descripcion")
        .value = "";


      document
        .getElementById("monto")
        .value = "";


      document
        .getElementById("descripcion")
        .focus();


    } catch (error) {

      console.error(
        "Error al guardar:",
        error
      );


      alert(
        "No se pudo guardar el gasto en Firebase."
      );

    } finally {

      boton.disabled = false;

      boton.textContent =
        "Agregar gasto";

    }

  }


  /*
  ======================================
  ELIMINAR GASTO
  ======================================
  */

  async function eliminarGasto(id) {

    const gasto =
      gastos.find(
        (g) => g.id === id
      );


    if (!gasto) {
      return;
    }


    const confirmar =
      confirm(
        "¿Deseás eliminar el gasto \"" +
        gasto.descripcion +
        "\" por $" +
        formatoDinero(gasto.monto) +
        "?"
      );


    if (!confirmar) {
      return;
    }


    try {

      await deleteDoc(
        doc(db, "gastos", id)
      );

    } catch (error) {

      console.error(
        "Error al eliminar:",
        error
      );


      alert(
        "No se pudo eliminar el gasto."
      );

    }

  }


  /*
  ======================================
  HACER FUNCIONES ACCESIBLES AL HTML
  ======================================
  */

  window.agregarGasto =
    agregarGasto;

</script>


</body>

</html>

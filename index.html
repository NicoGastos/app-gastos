<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestros Gastos</title>
<link rel="icon" type="image/png" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    h1 {
      text-align: center;
      margin: 8px 0 3px;
    }

    .subtitulo, .estado {
      text-align: center;
      color: #666;
    }

    .estado {
      font-size: 13px;
      margin: 8px 0 16px;
    }

    .mes-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button.secundario {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tarjeta {
      background: white;
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .tarjeta span {
      font-size: 13px;
      color: #666;
    }

    .tarjeta strong {
      display: block;
      font-size: 21px;
      margin-top: 5px;
    }

    .formulario, .reportes, .filtros {
      background: white;
      padding: 17px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .formulario input,
    .formulario select,
    .formulario button,
    .filtros select {
      margin-top: 9px;
    }

    .botones {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .titulo-seccion {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .gasto {
      background: white;
      padding: 14px;
      margin-bottom: 9px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.05);
    }

    .datos-gasto { flex: 1; }

    .descripcion {
      font-weight: bold;
      font-size: 16px;
    }

    .detalle {
      font-size: 14px;
      color: #555;
      margin-top: 4px;
    }

    .fecha {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .acciones {
      white-space: nowrap;
      margin-left: 8px;
    }

    .acciones span {
      font-size: 21px;
      cursor: pointer;
      padding: 7px;
    }

    .reporte-linea {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .oculto { display: none; }
    .positivo { color: #16803c; }
    .negativo { color: #b42318; }

    .sin-datos {
      text-align: center;
      color: #777;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>💰 Nuestros Gastos</h1>
  <div class="subtitulo">Cyn & Nico</div>
  <div class="estado" id="estado">Conectando...</div>

  <div class="mes-selector">
    <input type="month" id="mesSeleccionado">
  </div>

  <div class="resumen">

    <div class="tarjeta">
      <span>💵 Ingresos</span>
      <strong id="totalIngresos">$0</strong>
    </div>

    <div class="tarjeta">
      <span>💸 Gastos</span>
      <strong id="totalGastos">$0</strong>
    </div>

    <div class="tarjeta">
      <span>💰 Disponible</span>
      <strong id="disponible">$0</strong>
    </div>

    <div class="tarjeta">
      <span>🧾 Movimientos</span>
      <strong id="cantidadGastos">0</strong>
    </div>

  </div>

  <div class="botones">
    <button onclick="mostrarFormularioGasto()">➕ Gasto</button>
    <button onclick="mostrarFormularioIngreso()">💵 Ingreso</button>
  </div>

  <div class="botones">
    <button class="secundario" onclick="toggleReportes()">📊 Reportes</button>
    <button class="secundario" onclick="toggleFiltros()">🔎 Filtros</button>
  </div>

  <br>

  <!-- GASTOS -->
  <div class="formulario" id="formGasto">

    <div class="titulo-seccion" id="tituloFormGasto">Agregar gasto</div>

    <input type="text" id="descripcion" placeholder="¿En qué gastamos?">

    <input type="number" id="monto" placeholder="Monto" min="0" step="0.01">

    <select id="categoria">
      <option value="Otros">Otros</option>
      <option value="Comida">Comida</option>
      <option value="Transporte">Transporte</option>
      <option value="Impuestos">Impuestos</option>
      <option value="Tarjetas Ciudad">Tarjetas Ciudad</option>
      <option value="Tarjetas Nacion">Tarjetas Nacion</option>
      <option value="Tarjetas BBVA">Tarjetas BBVA</option>
      <option value="Colegio Juli">Colegio Juli</option>
      <option value="Colegio Agus">Colegio Agus</option>
      <option value="Colegio Tomi">Colegio Tomi</option>
      <option value="Terapia Maga">Maga</option>
      <option value="Terapia Ale">Ale</option>
      <option value="Supermercado">Supermercado</option>
      <option value="Cochera Auto">Cochera Auto</option>
      <option value="Cochera Moto">Cochera Moto</option>
      <option value="Seguro Auto">Seguro Auto</option>
      <option value="Seguro Moto">Seguro Moto</option>
      <option value="Expensas">Expensas</option>
      <option value="Luz">Luz</option>
      <option value="Gas">Gas</option>
      <option value="ABL">ABL</option>
      <option value="AYSA">AYSA</option>
      <option value="CABLE">CABLE</option>
      <option value="Celular">Celular</option>
      <option value="Viaje de Egresado">Viaje Egresados Juli</option>
      <option value="Gira Deportiva">Gira Deportiva Juli</option>
    </select>

    <select id="persona">
      <option value="Nico">Nico</option>
      <option value="Cyn">Cyn</option>
    </select>

    <button id="botonGuardarGasto" onclick="guardarGasto()">
      Agregar gasto
    </button>

    <button
      id="botonCancelarEdicion"
      class="secundario oculto"
      onclick="cancelarEdicion()">
      Cancelar edición
    </button>

  </div>


  <!-- INGRESOS -->
  <div class="formulario oculto" id="formIngreso">

    <div class="titulo-seccion" id="tituloFormIngreso">
      Agregar ingreso
    </div>

    <input
      type="text"
      id="descripcionIngreso"
      placeholder="Descripción del ingreso">

    <input
      type="number"
      id="montoIngreso"
      placeholder="Monto"
      min="0"
      step="0.01">

    <select id="personaIngreso">
      <option value="Nico">Nico</option>
      <option value="Cyn">Cyn</option>
    </select>

    <button id="botonGuardarIngreso" onclick="guardarIngreso()">
      Guardar ingreso
    </button>

    <button
      id="botonCancelarIngreso"
      class="secundario oculto"
      onclick="cancelarEdicionIngreso()">
      Cancelar edición
    </button>

  </div>


  <!-- FILTROS -->
  <div class="filtros oculto" id="panelFiltros">

    <div class="titulo-seccion">🔎 Filtros</div>

    <select id="filtroPersona">
      <option value="">Todos</option>
      <option value="Nico">Nico</option>
      <option value="Cyn">Cyn</option>
    </select>

    <select id="filtroCategoria">
      <option value="">Todas las categorías</option>
    </select>

    <button class="secundario" onclick="limpiarFiltros()">
      Limpiar filtros
    </button>

  </div>


  <!-- REPORTES -->
  <div class="reportes oculto" id="panelReportes">

    <div class="titulo-seccion">📊 Reporte del mes</div>

    <div class="reporte-linea">
      <span>Gastos Nico</span>
      <strong id="reporteNico">$0</strong>
    </div>

    <div class="reporte-linea">
      <span>Gastos Cyn</span>
      <strong id="reporteCyn">$0</strong>
    </div>

    <br>

    <strong>Por categoría</strong>

    <div id="reporteCategorias"></div>

  </div>


  <div class="titulo-seccion">Movimientos</div>

  <div id="lista"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  onSnapshot,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCLKkcyErLlAWXx7pIPyvj8ihqwedljXi98",
  authDomain: "app-gastos-aa092.firebaseapp.com",
  projectId: "app-gastos-aa092",
  storageBucket: "app-gastos-aa092.firebasestorage.app",
  messagingSenderId: "619381910434",
  appId: "1:619381910434:web:bb1dc0a9a4336b979de0fb"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const gastosRef = collection(db, "gastos");
const ingresosRef = collection(db, "ingresos");

let gastos = [];
let ingresos = [];

let gastoEditando = null;
let ingresoEditando = null;


/* MES ACTUAL */

const hoy = new Date();

const mesActual =
  hoy.getFullYear() +
  "-" +
  String(hoy.getMonth() + 1).padStart(2, "0");

document.getElementById("mesSeleccionado").value = mesActual;


/* FORMATO DINERO */

function dinero(valor) {

  return "$" +
    Number(valor || 0).toLocaleString(
      "es-AR",
      { maximumFractionDigits: 2 }
    );
}


/* FECHAS */

function obtenerFecha(fechaFirebase) {

  if (!fechaFirebase) return null;

  try {

    if (typeof fechaFirebase.toDate === "function") {
      return fechaFirebase.toDate();
    }

    return new Date(fechaFirebase);

  } catch {
    return null;
  }
}


function perteneceAlMes(fechaFirebase) {

  const fecha = obtenerFecha(fechaFirebase);

  if (!fecha) return false;

  const mes =
    document.getElementById("mesSeleccionado").value;

  const [anio, numeroMes] = mes.split("-");

  return (
    fecha.getFullYear() === Number(anio) &&
    fecha.getMonth() + 1 === Number(numeroMes)
  );
}


/* FIREBASE GASTOS */

onSnapshot(
  gastosRef,

  snapshot => {

    gastos = [];

    snapshot.forEach(documento => {

      gastos.push({
        id: documento.id,
        ...documento.data()
      });

    });

    document.getElementById("estado").textContent =
      "☁️ Sincronizado";

    actualizarPantalla();
  },

  error => {

    console.error(error);

    document.getElementById("estado").textContent =
      "⚠️ Error de conexión";
  }
);


/* FIREBASE INGRESOS */

onSnapshot(
  ingresosRef,

  snapshot => {

    ingresos = [];

    snapshot.forEach(documento => {

      ingresos.push({
        id: documento.id,
        ...documento.data()
      });

    });

    actualizarPantalla();
  }
);


/* GUARDAR GASTO */

async function guardarGasto() {

  const descripcion =
    document.getElementById("descripcion").value.trim();

  const monto =
    Number(document.getElementById("monto").value);

  const categoria =
    document.getElementById("categoria").value;

  const persona =
    document.getElementById("persona").value;


  if (!descripcion || !monto || monto <= 0) {

    alert("Completá descripción y monto.");
    return;
  }


  try {

    if (gastoEditando) {

      await updateDoc(
        doc(db, "gastos", gastoEditando),
        {
          descripcion,
          monto,
          categoria,
          persona
        }
      );

      cancelarEdicion();

    } else {

      await addDoc(
        gastosRef,
        {
          descripcion,
          monto,
          categoria,
          persona,
          fecha: serverTimestamp()
        }
      );

      limpiarFormularioGasto();
    }

  } catch (error) {

    console.error(error);
    alert("No se pudo guardar el gasto.");
  }
}


function limpiarFormularioGasto() {

  document.getElementById("descripcion").value = "";
  document.getElementById("monto").value = "";
}


function editarGasto(id) {

  const gasto = gastos.find(g => g.id === id);

  if (!gasto) return;

  gastoEditando = id;

  mostrarFormularioGasto();

  document.getElementById("descripcion").value =
    gasto.descripcion;

  document.getElementById("monto").value =
    gasto.monto;

  document.getElementById("categoria").value =
    gasto.categoria;

  document.getElementById("persona").value =
    gasto.persona;

  document.getElementById("tituloFormGasto").textContent =
    "Editar gasto";

  document.getElementById("botonGuardarGasto").textContent =
    "Guardar cambios";

  document.getElementById("botonCancelarEdicion")
    .classList.remove("oculto");

  document.getElementById("formGasto")
    .scrollIntoView({ behavior: "smooth" });
}


function cancelarEdicion() {

  gastoEditando = null;

  limpiarFormularioGasto();

  document.getElementById("tituloFormGasto").textContent =
    "Agregar gasto";

  document.getElementById("botonGuardarGasto").textContent =
    "Agregar gasto";

  document.getElementById("botonCancelarEdicion")
    .classList.add("oculto");
}


async function eliminarGasto(id) {

  const gasto = gastos.find(g => g.id === id);

  if (!gasto) return;

  if (
    !confirm(
      `¿Eliminar "${gasto.descripcion}" por ${dinero(gasto.monto)}?`
    )
  ) return;

  await deleteDoc(doc(db, "gastos", id));
}


/* =============================
   INGRESOS - AGREGAR Y EDITAR
============================= */

async function guardarIngreso() {

  const descripcion =
    document.getElementById("descripcionIngreso")
      .value.trim();

  const monto =
    Number(
      document.getElementById("montoIngreso").value
    );

  const persona =
    document.getElementById("personaIngreso").value;


  if (!descripcion || !monto || monto <= 0) {

    alert("Completá descripción y monto del ingreso.");
    return;
  }


  try {

    if (ingresoEditando) {

      await updateDoc(
        doc(db, "ingresos", ingresoEditando),
        {
          descripcion,
          monto,
          persona
        }
      );

      cancelarEdicionIngreso();

    } else {

      await addDoc(
        ingresosRef,
        {
          descripcion,
          monto,
          persona,
          fecha: serverTimestamp()
        }
      );

      limpiarFormularioIngreso();
    }

  } catch (error) {

    console.error(error);
    alert("No se pudo guardar el ingreso.");
  }
}


function limpiarFormularioIngreso() {

  document.getElementById("descripcionIngreso").value = "";
  document.getElementById("montoIngreso").value = "";
}


function editarIngreso(id) {

  const ingreso =
    ingresos.find(i => i.id === id);

  if (!ingreso) return;

  ingresoEditando = id;

  mostrarFormularioIngreso();

  document.getElementById("descripcionIngreso").value =
    ingreso.descripcion;

  document.getElementById("montoIngreso").value =
    ingreso.monto;

  document.getElementById("personaIngreso").value =
    ingreso.persona;

  document.getElementById("tituloFormIngreso").textContent =
    "Editar ingreso";

  document.getElementById("botonGuardarIngreso").textContent =
    "Guardar cambios";

  document.getElementById("botonCancelarIngreso")
    .classList.remove("oculto");

  document.getElementById("formIngreso")
    .scrollIntoView({ behavior: "smooth" });
}


function cancelarEdicionIngreso() {

  ingresoEditando = null;

  limpiarFormularioIngreso();

  document.getElementById("tituloFormIngreso").textContent =
    "Agregar ingreso";

  document.getElementById("botonGuardarIngreso").textContent =
    "Guardar ingreso";

  document.getElementById("botonCancelarIngreso")
    .classList.add("oculto");
}


async function eliminarIngreso(id) {

  const ingreso =
    ingresos.find(i => i.id === id);

  if (!ingreso) return;

  if (
    !confirm(
      `¿Eliminar "${ingreso.descripcion}" por ${dinero(ingreso.monto)}?`
    )
  ) return;

  await deleteDoc(
    doc(db, "ingresos", id)
  );
}


/* ACTUALIZAR PANTALLA */

function actualizarPantalla() {

  const gastosMes =
    gastos.filter(g => perteneceAlMes(g.fecha));

  const ingresosMes =
    ingresos.filter(i => perteneceAlMes(i.fecha));


  const totalGastos =
    gastosMes.reduce(
      (total, g) => total + Number(g.monto || 0),
      0
    );


  const totalIngresos =
    ingresosMes.reduce(
      (total, i) => total + Number(i.monto || 0),
      0
    );


  const disponible =
    totalIngresos - totalGastos;


  document.getElementById("totalGastos").textContent =
    dinero(totalGastos);

  document.getElementById("totalIngresos").textContent =
    dinero(totalIngresos);

  const disponibleElemento =
    document.getElementById("disponible");

  disponibleElemento.textContent =
    dinero(disponible);

  disponibleElemento.className =
    disponible >= 0 ? "positivo" : "negativo";


  document.getElementById("cantidadGastos").textContent =
    gastosMes.length + ingresosMes.length;


  mostrarMovimientos(gastosMes, ingresosMes);

  generarReportes(gastosMes);

  cargarCategoriasFiltro();
}


/* MOVIMIENTOS */

function mostrarMovimientos(gastosMes, ingresosMes) {

  const lista =
    document.getElementById("lista");

  lista.innerHTML = "";


  const filtroPersona =
    document.getElementById("filtroPersona").value;

  const filtroCategoria =
    document.getElementById("filtroCategoria").value;


  let movimientos = [];


  gastosMes.forEach(gasto => {

    if (
      filtroPersona &&
      gasto.persona !== filtroPersona
    ) return;

    if (
      filtroCategoria &&
      gasto.categoria !== filtroCategoria
    ) return;

    movimientos.push({
      ...gasto,
      tipo: "gasto"
    });
  });


  ingresosMes.forEach(ingreso => {

    if (
      filtroPersona &&
      ingreso.persona !== filtroPersona
    ) return;

    if (filtroCategoria) return;

    movimientos.push({
      ...ingreso,
      tipo: "ingreso"
    });
  });


  movimientos.sort((a, b) => {

    const fa = obtenerFecha(a.fecha);
    const fb = obtenerFecha(b.fecha);

    return (fb || 0) - (fa || 0);
  });


  if (movimientos.length === 0) {

    lista.innerHTML =
      `<div class="sin-datos">
        No hay movimientos para mostrar.
       </div>`;

    return;
  }


  movimientos.forEach(movimiento => {

    const fecha =
      obtenerFecha(movimiento.fecha);

    const fechaTexto =
      fecha
        ? fecha.toLocaleString("es-AR")
        : "";


    const item =
      document.createElement("div");

    item.className = "gasto";


    if (movimiento.tipo === "gasto") {

      item.innerHTML = `

        <div class="datos-gasto">

          <div class="descripcion">
            ${movimiento.descripcion}
          </div>

          <div class="detalle">
            💸 ${dinero(movimiento.monto)}
            · ${movimiento.categoria}
            · ${movimiento.persona}
          </div>

          <div class="fecha">
            ${fechaTexto}
          </div>

        </div>

        <div class="acciones">

          <span onclick="editarGasto('${movimiento.id}')">
            ✏️
          </span>

          <span onclick="eliminarGasto('${movimiento.id}')">
            🗑️
          </span>

        </div>
      `;

    } else {

      item.innerHTML = `

        <div class="datos-gasto">

          <div class="descripcion">
            ${movimiento.descripcion}
          </div>

          <div class="detalle positivo">
            💵 +${dinero(movimiento.monto)}
            · ${movimiento.persona}
          </div>

          <div class="fecha">
            ${fechaTexto}
          </div>

        </div>

        <div class="acciones">

          <span onclick="editarIngreso('${movimiento.id}')">
            ✏️
          </span>

          <span onclick="eliminarIngreso('${movimiento.id}')">
            🗑️
          </span>

        </div>
      `;
    }

    lista.appendChild(item);
  });
}


/* REPORTES */

function generarReportes(gastosMes) {

  let nico = 0;
  let cyn = 0;

  const categorias = {};


  gastosMes.forEach(gasto => {

    const monto =
      Number(gasto.monto || 0);

    if (gasto.persona === "Nico") {
      nico += monto;
    }

    if (gasto.persona === "Cyn") {
      cyn += monto;
    }

    if (!categorias[gasto.categoria]) {
      categorias[gasto.categoria] = 0;
    }

    categorias[gasto.categoria] += monto;
  });


  document.getElementById("reporteNico").textContent =
    dinero(nico);

  document.getElementById("reporteCyn").textContent =
    dinero(cyn);


  const contenedor =
    document.getElementById("reporteCategorias");

  contenedor.innerHTML = "";


  Object.entries(categorias)
    .sort((a, b) => b[1] - a[1])
    .forEach(([categoria, total]) => {

      const fila =
        document.createElement("div");

      fila.className = "reporte-linea";

      fila.innerHTML = `
        <span>${categoria}</span>
        <strong>${dinero(total)}</strong>
      `;

      contenedor.appendChild(fila);
    });
}


/* FILTROS */

function cargarCategoriasFiltro() {

  const selector =
    document.getElementById("filtroCategoria");

  const actual = selector.value;

  const categorias =
    [...new Set(
      gastos.map(g => g.categoria)
    )].sort();


  selector.innerHTML =
    `<option value="">
      Todas las categorías
     </option>`;


  categorias.forEach(categoria => {

    const opcion =
      document.createElement("option");

    opcion.value = categoria;
    opcion.textContent = categoria;

    selector.appendChild(opcion);
  });

  selector.value = actual;
}


function limpiarFiltros() {

  document.getElementById("filtroPersona").value = "";
  document.getElementById("filtroCategoria").value = "";

  actualizarPantalla();
}


/* PANELES */

function mostrarFormularioGasto() {

  document.getElementById("formGasto")
    .classList.remove("oculto");

  document.getElementById("formIngreso")
    .classList.add("oculto");
}


function mostrarFormularioIngreso() {

  document.getElementById("formIngreso")
    .classList.remove("oculto");

  document.getElementById("formGasto")
    .classList.add("oculto");
}


function toggleReportes() {

  document.getElementById("panelReportes")
    .classList.toggle("oculto");
}


function toggleFiltros() {

  document.getElementById("panelFiltros")
    .classList.toggle("oculto");
}


/* EVENTOS */

document.getElementById("mesSeleccionado")
  .addEventListener("change", actualizarPantalla);

document.getElementById("filtroPersona")
  .addEventListener("change", actualizarPantalla);

document.getElementById("filtroCategoria")
  .addEventListener("change", actualizarPantalla);


/* FUNCIONES PARA HTML */

window.guardarGasto = guardarGasto;
window.editarGasto = editarGasto;
window.eliminarGasto = eliminarGasto;
window.cancelarEdicion = cancelarEdicion;

window.guardarIngreso = guardarIngreso;
window.editarIngreso = editarIngreso;
window.eliminarIngreso = eliminarIngreso;
window.cancelarEdicionIngreso = cancelarEdicionIngreso;

window.mostrarFormularioGasto = mostrarFormularioGasto;
window.mostrarFormularioIngreso = mostrarFormularioIngreso;

window.toggleReportes = toggleReportes;
window.toggleFiltros = toggleFiltros;
window.limpiarFiltros = limpiarFiltros;

</script>

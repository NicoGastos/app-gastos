<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestros Gastos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .saldo {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .saldo h2 {
      margin: 5px;
      font-size: 32px;
    }

    .formulario {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .lista {
      margin-top: 20px;
    }

    .gasto {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>💰 Nuestros Gastos</h1>
    <div class="subtitulo">Nico & Cyn</div>

    <div class="saldo">
      <div>Total gastado</div>
      <h2 id="total">$0</h2>
    </div>

    <div class="formulario">

      <input
        type="text"
        id="descripcion"
        placeholder="¿En qué gastamos?"
      >

      <input
        type="number"
        id="monto"
        placeholder="Monto"
      >

         <select id="categoria">
  <option value="Otros">Otros</option>
  <option value="Comida">Comida</option>
  <option value="Transporte">Transporte</option>
  <option value="Impuestos">Impuestos</option>
  <option value="Tarjetas Ciudad">Tarjetas Ciudad</option>
  <option value="Tarjetas Nacion">Tarjetas Nacion</option>
  <option value="Tarjetas BBVA">Tarjetas BBVA</option>
  <option value="Colegio Juli">Colegio Juli</option>
   <option value="Colegio Agus">Colegio Agus</option>
    <option value="Colegio Tomi">Colegio Tomi</option>
  <option value="Terapia Maga">Maga</option>
  <option value="Terapia Ale">Ale</option>
  <option value="Otros">Supermercado</option>
  <option value="Cochera Auto">Cochera Auto</option>
  <option value="Cochera Moto">Cochera Moto</option>
  <option value="Seguro Auto">Seguro Auto</option>
  <option value="Seguro Moto">Seguro Moto</option>
  <option value="Expensas">Expensas</option>
  <option value="Luz">Luz</option>
  <option value="Gas">Gas</option>
  <option value="ABL">ABL</option>
  <option value="AYSA">AYSA</option>
  <option value="CABLE">CABLE</option>
  <option value="Celular">Celular</option>
  <option value="Viaje de Egresado">Viaje Egresados Juli</option>
  <option value="Gira Deportiva">Gira Deportiva Juli</option>
      </select>

      <select id="persona">
        <option>Nico</option>
        <option>Cyn</option>
      </select>

      <button onclick="agregarGasto()">
        Agregar gasto
      </button>

    </div>

    <div class="lista" id="lista"></div>

  </div>

  <script>
    let gastos = [];

    function agregarGasto() {

      const descripcion =
       document.getElementById("descripcion").value;
    const monto = document.getElementById("monto").value;
    const categoria = document.getElementById("categoria").value;
    const persona = document.getElementById("persona").value;

    if (descripcion === "" || monto === "") {
      alert("Completá la descripción y el monto");
      return;
    }

    const gasto = {
      descripcion: descripcion,
      monto: Number(monto),
      categoria: categoria,
      persona: persona
    };

    gastos.push(gasto);

    mostrarGastos();

    document.getElementById("descripcion").value = "";
    document.getElementById("monto").value = "";
  }

  function mostrarGastos() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    gastos.forEach((gasto, index) => {
      const item = document.createElement("div");

      item.innerHTML = `
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <strong>${gasto.descripcion}</strong><br>
      $${gasto.monto} - ${gasto.categoria} - ${gasto.persona}
    </div>

    <span
      onclick="eliminarGasto(${index})"
      style="font-size:22px; cursor:pointer; padding:10px;"
    >🗑️</span>
  </div>
`;

      lista.appendChild(item);
    });
  }

  function eliminarGasto(index) {
  const confirmar = confirm("¿Deseás eliminar este gasto?");

  if (confirmar) {
    gastos.splice(index, 1);
    mostrarGastos();
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nuestros Gastos</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .saldo {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .saldo h2 {
      margin: 5px;
      font-size: 32px;
    }

    .formulario {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input,
    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .lista {
      margin-top: 20px;
    }

    .gasto {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .datos-gasto {
      flex: 1;
    }

    .descripcion {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .detalle {
      color: #555;
      font-size: 14px;
    }

    .eliminar {
      font-size: 23px;
      cursor: pointer;
      padding: 10px;
      margin-left: 10px;
    }

  </style>
</head>


<body>

<div class="contenedor">

  <h1>💰 Nuestros Gastos</h1>

  <div class="subtitulo">
    Nico & Cyn
  </div>


  <div class="saldo">

    <div>Total gastado</div>

    <h2 id="total">$0</h2>

  </div>


  <div class="formulario">

    <input
      type="text"
      id="descripcion"
      placeholder="¿En qué gastamos?"
    >


    <input
      type="number"
      id="monto"
      placeholder="Monto"
      min="0"
      step="0.01"
    >


    <select id="categoria">

      <option value="Otros">Otros</option>

      <option value="Comida">Comida</option>

      <option value="Transporte">Transporte</option>

      <option value="Impuestos">Impuestos</option>

      <option value="Tarjetas Ciudad">Tarjetas Ciudad</option>

      <option value="Tarjetas Nacion">Tarjetas Nacion</option>

      <option value="Tarjetas BBVA">Tarjetas BBVA</option>

      <option value="Colegio Juli">Colegio Juli</option>

      <option value="Colegio Agus">Colegio Agus</option>

      <option value="Colegio Tomi">Colegio Tomi</option>

      <option value="Terapia Maga">Maga</option>

      <option value="Terapia Ale">Ale</option>

      <option value="Supermercado">Supermercado</option>

      <option value="Cochera Auto">Cochera Auto</option>

      <option value="Cochera Moto">Cochera Moto</option>

      <option value="Seguro Auto">Seguro Auto</option>

      <option value="Seguro Moto">Seguro Moto</option>

      <option value="Expensas">Expensas</option>

      <option value="Luz">Luz</option>

      <option value="Gas">Gas</option>

      <option value="ABL">ABL</option>

      <option value="AYSA">AYSA</option>

      <option value="CABLE">CABLE</option>

      <option value="Celular">Celular</option>

      <option value="Viaje de Egresado">
        Viaje Egresados Juli
      </option>

      <option value="Gira Deportiva">
        Gira Deportiva Juli
      </option>

    </select>


    <select id="persona">

      <option value="Nico">Nico</option>

      <option value="Cyn">Cyn</option>

    </select>


    <button
      type="button"
      onclick="agregarGasto()"
    >
      Agregar gasto
    </button>

  </div>


  <div
    class="lista"
    id="lista"
  ></div>

</div>


<script>

  const CLAVE_GASTOS = "nicogastos_v1";

  let gastos = [];


  /*
  ==============================
  CARGAR DATOS GUARDADOS
  ==============================
  */

  function cargarGastos() {

    try {

      const datosGuardados =
        localStorage.getItem(CLAVE_GASTOS);

      if (datosGuardados) {

        gastos = JSON.parse(datosGuardados);

        if (!Array.isArray(gastos)) {
          gastos = [];
        }

      } else {

        /*
        Busca también datos guardados
        con la versión anterior.
        */

        const datosAnteriores =
          localStorage.getItem("gastos");

        if (datosAnteriores) {

          gastos = JSON.parse(datosAnteriores);

          if (!Array.isArray(gastos)) {
            gastos = [];
          }

          guardarGastos();

        }

      }

    } catch (error) {

      console.error(
        "Error al cargar gastos:",
        error
      );

      gastos = [];

    }

  }


  /*
  ==============================
  GUARDAR DATOS
  ==============================
  */

  function guardarGastos() {

    try {

      localStorage.setItem(
        CLAVE_GASTOS,
        JSON.stringify(gastos)
      );

    } catch (error) {

      console.error(
        "Error al guardar:",
        error
      );

      alert(
        "No se pudieron guardar los datos."
      );

    }

  }


  /*
  ==============================
  AGREGAR GASTO
  ==============================
  */

  function agregarGasto() {

    const descripcion =
      document
        .getElementById("descripcion")
        .value
        .trim();


    const montoTexto =
      document
        .getElementById("monto")
        .value;


    const categoria =
      document
        .getElementById("categoria")
        .value;


    const persona =
      document
        .getElementById("persona")
        .value;


    const monto =
      Number(montoTexto);


    if (descripcion === "") {

      alert(
        "Ingresá una descripción."
      );

      return;

    }


    if (
      montoTexto === "" ||
      isNaN(monto) ||
      monto <= 0
    ) {

      alert(
        "Ingresá un monto válido."
      );

      return;

    }


    const gasto = {

      id: Date.now(),

      descripcion: descripcion,

      monto: monto,

      categoria: categoria,

      persona: persona,

      fecha: new Date().toISOString()

    };


    gastos.push(gasto);


    /*
    PRIMERO GUARDA
    */

    guardarGastos();


    /*
    DESPUÉS ACTUALIZA
    LA PANTALLA
    */

    mostrarGastos();


    /*
    LIMPIAR CAMPOS
    */

    document
      .getElementById("descripcion")
      .value = "";


    document
      .getElementById("monto")
      .value = "";


    document
      .getElementById("descripcion")
      .focus();

  }


  /*
  ==============================
  MOSTRAR GASTOS Y TOTAL
  ==============================
  */

  function mostrarGastos() {

    const lista =
      document.getElementById("lista");


    const totalElemento =
      document.getElementById("total");


    lista.innerHTML = "";


    let total = 0;


    gastos.forEach(
      (gasto, index) => {

        const monto =
          Number(gasto.monto) || 0;


        /*
        SUMAR CADA GASTO
        */

        total = total + monto;


        const item =
          document.createElement("div");


        item.className = "gasto";


        const montoFormateado =
          monto.toLocaleString(
            "es-AR",
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }
          );


        item.innerHTML = `

          <div class="datos-gasto">

            <div class="descripcion">
              ${gasto.descripcion}
            </div>

            <div class="detalle">

              $${montoFormateado}

              ·

              ${gasto.categoria}

              ·

              ${gasto.persona}

            </div>

          </div>


          <span
            class="eliminar"
            onclick="eliminarGasto(${index})"
            title="Eliminar gasto"
          >
            🗑️
          </span>

        `;


        lista.appendChild(item);

      }
    );


    /*
    MOSTRAR TOTAL
    */

    const totalFormateado =
      total.toLocaleString(
        "es-AR",
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }
      );


    totalElemento.textContent =
      "$" + totalFormateado;

  }


  /*
  ==============================
  ELIMINAR GASTO
  ==============================
  */

  function eliminarGasto(index) {

    const gasto =
      gastos[index];


    const confirmar =
      confirm(
        "¿Deseás eliminar el gasto \"" +
        gasto.descripcion +
        "\" por $" +
        Number(gasto.monto)
          .toLocaleString("es-AR") +
        "?"
      );


    if (!confirmar) {
      return;
    }


    gastos.splice(index, 1);


    /*
    GUARDAR EL CAMBIO
    */

    guardarGastos();


    /*
    RECALCULAR LISTA Y TOTAL
    */

    mostrarGastos();

  }


  /*
  ==============================
  INICIAR APP
  ==============================
  */

  cargarGastos();

  mostrarGastos();

</script>


</body>

</html>
